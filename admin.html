async function getDl(){try{var r=await fetch("https://api.github.com/repos/ouedraogomazou586-bot/yiridesign/releases?per_page=100");if(!r.ok)return null;var j=await r.json(),t=0,l=[];j.forEach(function(x){var n=0;(x.assets||[]).forEach(function(a){if(/\.apk$/i.test(a.name))n+=a.download_count});t+=n;l.push({v:x.tag_name||x.name,n:n})});return {total:t,list:l.slice(0,8)}}catch(e){return null}}

var LIM_MO=500; /* limite de la base : 500 pour l'offre gratuite ; mets 8000 après le passage à l'offre Pro */

 if(!al)return '<h2>Alertes</h2><p class="mu">Alertes indisponibles : exécute le fichier controle.sql dans Supabase.</p>';

 return '<h2>Alertes</h2>'+L.join("");

 h+='<button id="fsave">Enregistrer les interrupteurs</button><h2>Message aux utilisateurs</h2><p class="mu">Affiché en haut de l\'accueil, avec une croix pour le fermer. Écris-le dans la langue de tes utilisateurs.</p><textarea id="mtxt" rows="3" maxlength="300" style="width:100%" placeholder="Ex. Nouvelle version disponible : mets à jour l\'application.">'+esc(m.texte||"")+'</textarea><label class="chk" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="mon"'+(m.actif?' checked':'')+'> Afficher ce message</label><button id="msave">Enregistrer le message</button>';
 return h;
}

 '<div class="grid"><div class="c"><div class="n">'+s.total+'</div><div class="l">Téléphones (total)</div></div>'+
 '<div class="c"><div class="n">'+s.actifs_1j+'</div><div class="l">Actifs 24 h</div></div>'+
